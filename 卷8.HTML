<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>托业阅读 卷八 练习题（带解析）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f4f7fa;
      padding: 20px;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #222;
      font-size: 24px;
    }
    .desc {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
      font-size: 14px;
    }
    .score-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding:12px 16px;
      background:#ecf4ff;
      border-radius:10px;
    }
    .q-item {
      margin-bottom: 32px;
    }
    .q-title {
      font-weight: 600;
      margin-bottom:10px;
      line-height:1.7;
    }
    .opt-item {
      padding: 9px 14px;
      margin:7px 0;
      border-radius:8px;
      cursor:pointer;
      transition:0.2s;
    }
    .opt-item:hover {
      background:#f0f6ff;
    }
    .opt-item.selected {
      background:#cce4ff;
    }
    .right {
      background:#d6f7dd !important;
    }
    .wrong {
      background:#ffdddd !important;
    }
    .explain {
      margin-top:12px;
      padding:12px 14px;
      background:#fff8cc;
      border-radius:8px;
      display:none;
      line-height:1.65;
    }
    .btn-group {
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:40px;
    }
    button {
      padding:10px 26px;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }
    .submit-btn {
      background:#2b78e4;
      color:white;
    }
    .reset-btn {
      background:#999;
      color:white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>托业阅读 · 卷八</h1>
    <div class="desc">提交自动判分 + 每题答案解析</div>
    <div class="score-box">
      <span>得分：<span id="score">0</span> / <span id="total">0</span></span>
      <span id="status">等待提交</span>
    </div>
    <div id="wrap"></div>
    <div class="btn-group">
      <button class="submit-btn" id="submitBtn">提交试卷</button>
      <button class="reset-btn" id="resetBtn">重新作答</button>
    </div>
  </div>

<script>
  const questionList = [
    {
      type:"single",
      title:"The board meeting has been ______ until next Monday morning.",
      options:{
        A:"reschedule",
        B:"rescheduled",
        C:"rescheduling",
        D:"rescheduleable"
      },
      answer:"B",
      explain:"答案 B。被动语态 be rescheduled 表示“被重新安排”，现在完成被动：has been rescheduled。"
    },
    {
      type:"single",
      title:"Every document should be ______ reviewed before submission.",
      options:{
        A:"careful",
        B:"carefully",
        C:"carefulness",
        D:"caring"
      },
      answer:"B",
      explain:"答案 B。副词 carefully 修饰动词 reviewed，表示“仔细地审核”。形容词不能直接修饰动词。"
    },
    {
      type:"single",
      title:"This new service is popular ______ small and medium-sized companies.",
      options:{
        A:"among",
        B:"between",
        C:"inside",
        D:"along"
      },
      answer:"A",
      explain:"答案 A。among 用于三者及以上群体“在……之中”；between 多用于两者之间。"
    },
    {
      type:"single",
      title:"We will postpone the outdoor seminar ______ the weather is bad.",
      options:{
        A:"if",
        B:"because",
        C:"so",
        D:"despite"
      },
      answer:"A",
      explain:"答案 A。if 如果；如果天气不好，研讨会延期，符合条件逻辑。"
    },
    {
      type:"single",
      title:"The weekly briefing starts ______ 10:00 a.m. in the second-floor meeting room.",
      options:{
        A:"at",
        B:"on",
        C:"in",
        D:"for"
      },
      answer:"A",
      explain:"答案 A。具体时刻前面介词固定用 at；on 接日期，in 接时间段。"
    },
    {
      type:"single",
      title:"The firm will ______ a new customer satisfaction survey next month.",
      options:{
        A:"conduct",
        B:"conducting",
        C:"conducted",
        D:"conduction"
      },
      answer:"A",
      explain:"答案 A。will + 动词原形；conduct a survey 开展调查。"
    },
    {
      type:"single",
      title:"______ the heavy traffic, all managers arrived on time for the meeting.",
      options:{
        A:"Despite",
        B:"Because",
        C:"Since",
        D:"If"
      },
      answer:"A",
      explain:"答案 A。despite + 名词短语，表让步：尽管堵车，所有人准时到场。"
    },
    {
      type:"single",
      title:"The report provides a complete ______ of this year’s market performance.",
      options:{
        A:"analyze",
        B:"analysis",
        C:"analytical",
        D:"analyzing"
      },
      answer:"B",
      explain:"答案 B。analysis 名词“分析”；complete 形容词后面接名词。"
    },
    {
      type:"single",
      title:"Please ask the courier ______ these packages to the front reception.",
      options:{
        A:"bring",
        B:"bringing",
        C:"brought",
        D:"brings"
      },
      answer:"A",
      explain:"答案 A。ask sb. (to) do sth.；bring sth. to 把东西送到某处。"
    },
    {
      type:"single",
      title:"The upgraded equipment allows workers to operate ______.",
      options:{
        A:"easy",
        B:"easily",
        C:"easiness",
        D:"easing"
      },
      answer:"B",
      explain:"答案 B。副词 easily 修饰动词 operate，表示“轻松地、便捷地”。"
    },
    {
      type:"single",
      title:"This quarter’s sales revenue is higher ______ the revenue of the same period last year.",
      options:{
        A:"than",
        B:"then",
        C:"as",
        D:"from"
      },
      answer:"A",
      explain:"答案 A。比较级 higher than，高于……；then 是副词“然后”，不能用于比较。"
    },
    {
      type:"single",
      title:"No one can enter the research lab ______ you hold an official access card.",
      options:{
        A:"unless",
        B:"if",
        C:"because",
        D:"so that"
      },
      answer:"A",
      explain:"答案 A。unless 除非；除非持有准入卡，否则不能进入实验室。"
    },
    {
      type:"single",
      title:"The chief manager spoke ______ about the excellent quarterly results.",
      options:{
        A:"positive",
        B:"positively",
        C:"positivity",
        D:"positron"
      },
      answer:"B",
      explain:"答案 B。副词 positively 修饰动词 spoke，表示“肯定地、赞许地”。"
    },
    {
      type:"single",
      title:"We are recruiting staff members ______ can speak multiple foreign languages.",
      options:{
        A:"who",
        B:"which",
        C:"whose",
        D:"whom"
      },
      answer:"A",
      explain:"答案 A。先行词是人，从句充当主语，用 who；whom 作宾语。"
    },
    {
      type:"single",
      title:"You can download the registration form ______ our official website.",
      options:{
        A:"from",
        B:"at",
        C:"by",
        D:"with"
      },
      answer:"A",
      explain:"答案 A。固定搭配 download sth. from the website，从官网下载表格。"
    },
    {
      type:"single",
      title:"Notice\nTo: All Staff\nFrom: Maintenance Team\nDate: Nov 21\nThe east elevator will be closed tomorrow from 10 a.m. to 1 p.m. for maintenance. Please use the stairs or west elevator.\n\nHow long will the east elevator be closed?",
      options:{
        A:"Three hours",
        B:"Four hours",
        C:"Five hours",
        D:"Half day"
      },
      answer:"A",
      explain:"答案 A。上午十点到下午一点，合计三小时。"
    },
    {
      type:"single",
      title:"Memo\nTo: Project Managers\nFrom: Mark Wilson\nSubject: Progress Meeting\nA progress meeting will be held this Wednesday at 3 p.m. in Room 806. Please bring your progress reports.\n\nWhere is the progress meeting?",
      options:{
        A:"Room 806",
        B:"Room 706",
        C:"Main hall",
        D:"Cafeteria"
      },
      answer:"A",
      explain:"答案 A。原文明确地点 in Room 806。"
    },
    {
      type:"single",
      title:"Email\nDear Mr. Taylor,\nYour high-speed train reservation is confirmed. Departure is at 8:15 a.m. and arrival is at 10:45 a.m. Free bottled water is provided on board.\nBest regards,\nExpress Rail\n\nWhat time does the train depart?",
      options:{
        A:"8:15 a.m.",
        B:"10:45 a.m.",
        C:"8:15 p.m.",
        D:"10:45 p.m."
      },
      answer:"A",
      explain:"答案 A。departure = 出发，发车时间早上 8:15。"
    },
    {
      type:"single",
      title:"Announcement\nStarting this Thursday, all visitors must register at the front desk and receive a temporary visitor badge before entering the office building.\n\nWhat must visitors receive?",
      options:{
        A:"A temporary visitor badge",
        B:"A parking pass",
        C:"An employee ID card",
        D:"A meal coupon"
      },
      answer:"A",
      explain:"答案 A。原文 receive a temporary visitor badge：临时访客证。"
    },
    {
      type:"single",
      title:"Letter\nDear Valued Customer,\nYour new order has been shipped today and is expected to arrive within five business days.\n\nWhen will the goods arrive?",
      options:{
        A:"Within five business days",
        B:"Tonight",
        C:"This weekend",
        D:"Next month"
      },
      answer:"A",
      explain:"答案 A。within five business days：五个工作日之内送达。"
    }
  ];

  const wrap = document.getElementById("wrap");
  const scoreDom = document.getElementById("score");
  const totalDom = document.getElementById("total");
  const statusDom = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");
  const resetBtn = document.getElementById("resetBtn");
  let isSubmit = false;

  function renderList(){
    wrap.innerHTML = "";
    questionList.forEach((item,idx)=>{
      const div = document.createElement("div");
      div.className = "q-item";
      div.dataset.index = idx;
      let html = `<div class="q-title">${idx+1}. ${item.title}</div>`;
      if(item.options){
        Object.entries(item.options).forEach(([key,text])=>{
          html += `<div class="opt-item" data-val="${key}">${key}. ${text}</div>`;
        })
      }
      html += `<div class="explain">${item.explain}</div>`;
      div.innerHTML = html;
      wrap.appendChild(div);
    })
    totalDom.innerText = questionList.length;
  }

  wrap.addEventListener("click",function(e){
    if(isSubmit) return;
    const opt = e.target.closest(".opt-item");
    if(!opt) return;
    const parent = opt.closest(".q-item");
    const allOpt = parent.querySelectorAll(".opt-item");
    allOpt.forEach(o=> o.classList.remove("selected"));
    opt.classList.add("selected");
  })

  function calcScore(){
    let rightCnt = 0;
    questionList.forEach((item,idx)=>{
      const parent = document.querySelector(`.q-item[data-index='${idx}']`);
      const opts = parent.querySelectorAll(".opt-item");
      const explainBox = parent.querySelector(".explain");
      const sel = parent.querySelector(".opt-item.selected");
      const userAns = sel ? sel.dataset.val : null;
      const correct = (userAns === item.answer);
      if(correct) rightCnt++;
      opts.forEach(o=>{
        if(o.dataset.val === item.answer){
          o.classList.add("right");
        }else if(o.classList.contains("selected")){
          o.classList.add("wrong");
        }
      })
      explainBox.style.display = "block";
    })
    return rightCnt;
  }

  submitBtn.onclick = function(){
    if(isSubmit) return;
    isSubmit = true;
    const s = calcScore();
    scoreDom.innerText = s;
    statusDom.innerText = "已提交 · 批改完成，请看解析";
  }

  resetBtn.onclick = function(){
    isSubmit = false;
    scoreDom.innerText = "0";
    statusDom.innerText = "等待提交";
    renderList();
  }

  renderList();
</script>
</body>
</html>
